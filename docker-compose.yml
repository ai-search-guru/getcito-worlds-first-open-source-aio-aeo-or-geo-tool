name: getcito

services:
  web:
    image: getcito-web:9.0.0
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: getcito-server:9.0.0
    build: ./backend
    ports:
      - "80:80"
    env_file:
      - ./backend/.env
    restart: unless-stopped
