name: Release

# Changesets-driven release train.
# - Push to master with pending changesets -> opens/updates a "Version Packages" PR
#   that bumps every workspace package (fixed group) and updates CHANGELOGs.
# - Merging that PR leaves no pending changesets -> the publish step runs and cuts
#   a single `v<version>` GitHub Release (see scripts/gh-release.mjs).

on:
  push:
    branches: [master]

# Never run two release jobs against master at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create tags + GitHub Releases
  pull-requests: write # open/update the Version Packages PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog/tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version PR or publish release
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release:github
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
